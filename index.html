<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Login & Register</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
      /* =========================================================
         1. SINGLE FULLSCREEN BACKGROUND IMAGE
         ========================================================= */
      .bg-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: -2;
      }

      /* Dark Blur Overlay for high contrast */
      .bg-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: -1;
      }

      /* =========================================================
         2. CARD STYLING & GLASSMORPHISM
         ========================================================= */
      .auth-card {
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        max-width: 460px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        overflow: hidden;
      }

      /* Floating social icon buttons */
      .btn-floating {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        border-color: #cbd5e1;
        color: #475569;
        text-decoration: none;
      }

      .btn-floating:hover, .btn-floating:focus {
        transform: translateY(-2px);
        background-color: #0284c7;
        border-color: #0284c7;
        color: #ffffff;
        box-shadow: 0 6px 14px rgba(2, 132, 199, 0.3);
      }

      /* Gradient buttons */
      .btn-gradient-primary {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        border: none;
        color: #ffffff;
        transition: all 0.3s ease;
      }

      .btn-gradient-primary:hover, .btn-gradient-primary:focus {
        background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
        color: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
      }

      .btn-gradient-success {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        border: none;
        color: #ffffff;
        transition: all 0.3s ease;
      }

      .btn-gradient-success:hover, .btn-gradient-success:focus {
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        color: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(16, 185, 129, 0.35);
      }

      /* Interactive links */
      .auth-switch-link {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .auth-switch-link:hover {
        color: #1d4ed8;
        text-decoration: underline;
      }

      /* =========================================================
         3. PURE CSS VIEW SWITCHING MECHANISM (NO JS)
         ========================================================= */
      .auth-tab-input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .view-container {
        display: none;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.35s ease, transform 0.35s ease;
      }

      /* Displays Login View when #tab-login radio is checked */
      #tab-login:checked ~ main .auth-card #loginView {
        display: block;
        opacity: 1;
        transform: translateY(0);
      }

      /* Displays Register View when #tab-register radio is checked */
      #tab-register:checked ~ main .auth-card #registerView {
        display: block;
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>

    <!-- Hidden Radio Controls for Pure CSS View Switching -->
    <input type="radio" id="tab-login" name="auth-toggle" class="auth-tab-input" checked>
    <input type="radio" id="tab-register" name="auth-toggle" class="auth-tab-input">

    <!-- Single Fullscreen Background Image -->
    <div class="bg-image" aria-hidden="true"></div>

    <!-- Dark Blur Overlay -->
    <div class="bg-overlay"></div>

    <!-- Main Center Layout Container -->
    <main class="container min-vh-100 d-flex justify-content-center align-items-center py-5 px-3">
      
      <!-- Single Card Container -->
      <section class="card auth-card rounded-4 p-4 p-sm-5 border-0">

        <!-- VIEW 1: LOGIN FORM -->
        <article id="loginView" class="view-container">
          <header class="text-center mb-4">
            <h1 class="h2 fw-bold text-dark mb-1">Welcome Back</h1>
            <p class="text-muted small">Sign in to manage your account</p>
          </header>

          <!-- Social Login Options -->
          <div class="text-center mb-3">
            <div class="d-flex justify-content-center gap-2 mb-2">
              <button type="button" class="btn btn-outline-secondary btn-floating" aria-label="Sign in with Google">
                <i class="fab fa-google" aria-hidden="true"></i>
              </button>
              <button type="button" class="btn btn-outline-secondary btn-floating" aria-label="Sign in with Facebook">
                <i class="fab fa-facebook-f" aria-hidden="true"></i>
              </button>
              <button type="button" class="btn btn-outline-secondary btn-floating" aria-label="Sign in with Twitter">
                <i class="fab fa-twitter" aria-hidden="true"></i>
              </button>
              <button type="button" class="btn btn-outline-secondary btn-floating" aria-label="Sign in with GitHub">
                <i class="fab fa-github" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="d-flex align-items-center my-3">
            <hr class="flex-grow-1 my-0 text-secondary opacity-25">
            <span class="px-3 text-muted small">or with email</span>
            <hr class="flex-grow-1 my-0 text-secondary opacity-25">
          </div>

          <!-- Sign In Form -->
          <form id="loginForm" action="#" method="POST">
            <div class="form-floating mb-3">
              <input type="text" id="loginName" name="username" class="form-control" placeholder="Email or Username" required autocomplete="username">
              <label for="loginName"><i class="fa-regular fa-envelope me-2 text-muted" aria-hidden="true"></i>Email or Username</label>
            </div>

            <div class="form-floating mb-3">
              <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Password" required autocomplete="current-password">
              <label for="loginPassword"><i class="fa-solid fa-lock me-2 text-muted" aria-hidden="true"></i>Password</label>
            </div>

            <div class="row mb-4 align-items-center">
              <div class="col-6">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="loginCheck" checked>
                  <label class="form-check-label text-secondary small" for="loginCheck">Remember me</label>
                </div>
              </div>
              <div class="col-6 text-end">
                <a href="#forgot-password" class="text-decoration-none small fw-semibold">Forgot password?</a>
              </div>
            </div>

            <button type="submit" class="btn btn-gradient-primary btn-lg w-100 py-3 rounded-3 fw-bold mb-3">
              Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-2" aria-hidden="true"></i>
            </button>
          </form>

          <!-- Navigation Switch Link -->
          <footer class="text-center pt-2 border-top">
            <p class="text-muted small mb-0">
              Don't have an account? 
              <label for="tab-register" class="auth-switch-link">Register here</label>
            </p>
          </footer>
        </article>

        <!-- VIEW 2: REGISTER FORM -->
        <article id="registerView" class="view-container">
          <header class="text-center mb-4">
            <h2 class="h2 fw-bold text-dark mb-1">Create Account</h2>
            <p class="text-muted small">Get started with your free account</p>
          </header>

          <!-- Register Form -->
          <form id="registerForm" action="#" method="POST">
            <div class="form-floating mb-3">
              <input type="text" id="regName" name="fullname" class="form-control" placeholder="Full Name" required autocomplete="name">
              <label for="regName"><i class="fa-regular fa-user me-2 text-muted" aria-hidden="true"></i>Full Name</label>
            </div>

            <div class="form-floating mb-3">
              <input type="email" id="regEmail" name="email" class="form-control" placeholder="Email Address" required autocomplete="email">
              <label for="regEmail"><i class="fa-regular fa-envelope me-2 text-muted" aria-hidden="true"></i>Email Address</label>
            </div>

            <div class="form-floating mb-3">
              <input type="password" id="regPassword" name="password" class="form-control" placeholder="Password" required minlength="8" autocomplete="new-password">
              <label for="regPassword"><i class="fa-solid fa-lock me-2 text-muted" aria-hidden="true"></i>Password</label>
            </div>

            <div class="form-floating mb-3">
              <input type="password" id="regPasswordConfirm" name="confirm_password" class="form-control" placeholder="Repeat Password" required minlength="8" autocomplete="new-password">
              <label for="regPasswordConfirm"><i class="fa-solid fa-shield-halved me-2 text-muted" aria-hidden="true"></i>Repeat Password</label>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input me-2" type="checkbox" id="regTerms" required>
              <label class="form-check-label text-secondary small" for="regTerms">
                I agree to the <a href="#terms" class="text-dark fw-semibold">Terms of Service</a> & <a href="#privacy" class="text-dark fw-semibold">Privacy Policy</a>
              </label>
            </div>

            <button type="submit" class="btn btn-gradient-success btn-lg w-100 py-3 rounded-3 fw-bold mb-3">
              Create Account <i class="fa-solid fa-user-plus ms-2" aria-hidden="true"></i>
            </button>
          </form>

          <!-- Navigation Switch Link -->
          <footer class="text-center pt-2 border-top">
            <p class="text-muted small mb-0">
              Already have an account? 
              <label for="tab-login" class="auth-switch-link">Sign In</label>
            </p>
          </footer>
        </article>

      </section>
    </main>

  </body>
</html>
